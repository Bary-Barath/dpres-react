<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPRES — Disaster Preparedness System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ═══════════════════════════════════
   VIBRANT RED DESIGN SYSTEM
   ═══════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      /* Backgrounds: Pure whites and crisp cool grays for contrast */
      --bg-deep: #f8fafc;
      --bg-base: #ffffff;
      --bg-surface: #ffffff;
      --bg-elevated: #fff1f2;
      --bg-hover: #ffe4e6;

      /* Primary Reds (Vibrant Crimson) */
      --red-600: #e11d48;
      --red-500: #f43f5e;
      --red-400: #fb7185;
      --red-glow: rgba(225, 29, 72, 0.15);

      /* Module Specific Accents */
      --orange-500: #f97316;
      --orange-400: #fb923c;
      --yellow-400: #fbbf24;
      --green-400: #34d399;
      --green-500: #10b981;
      --purple-500: #8b5cf6;
      --blue-500: #3b82f6;

      /* Text: High Contrast Slate */
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;

      /* Borders */
      --border: #e2e8f0;
      --border-accent: rgba(225, 29, 72, 0.35);

      --font-display: 'Poppins', sans-serif;
      --font-ui: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(225, 29, 72, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(225, 29, 72, 0.1), 0 8px 10px -6px rgba(225, 29, 72, 0.05);
    }

    html {
      font-size: 16px
    }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-weight: 500;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--red-400)
    }

    input,
    select,
    textarea {
      font-family: var(--font-ui);
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 10px;
      padding: .8rem 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: all .2s;
      width: 100%
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--red-400);
      box-shadow: 0 0 0 3px var(--red-glow);
      background: var(--bg-surface)
    }

    button {
      cursor: pointer;
      font-family: var(--font-ui)
    }

    a {
      color: inherit;
      text-decoration: none
    }

    table {
      border-collapse: collapse
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-family: var(--font-mono);
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .08em;
      padding: .3rem .8rem;
      border-radius: 20px;
      text-transform: uppercase
    }

    .badge-red {
      background: rgba(225, 29, 72, .1);
      color: var(--red-600);
      border: 1px solid rgba(225, 29, 72, .2)
    }

    .badge-green {
      background: rgba(16, 185, 129, .1);
      color: var(--green-500);
      border: 1px solid rgba(16, 185, 129, .2)
    }

    .badge-orange {
      background: rgba(249, 115, 22, .1);
      color: var(--orange-500);
      border: 1px solid rgba(249, 115, 22, .2)
    }

    .badge-yellow {
      background: rgba(251, 191, 36, .1);
      color: var(--yellow-400);
      border: 1px solid rgba(251, 191, 36, .2)
    }

    .badge-purple {
      background: rgba(139, 92, 246, .1);
      color: var(--purple-500);
      border: 1px solid rgba(139, 92, 246, .2)
    }

    .badge-muted {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border)
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(15px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.97)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .5
      }
    }

    @keyframes progressBar {
      from {
        width: 0
      }
    }

    .fade-in {
      animation: slideIn .5s cubic-bezier(0.16, 1, 0.3, 1) both
    }

    .pop-in {
      animation: popIn .5s cubic-bezier(0.16, 1, 0.3, 1) both
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .75rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: .95rem;
      letter-spacing: .02em;
      transition: all .2s;
      cursor: pointer
    }

    .btn-primary {
      background: var(--red-600);
      color: #fff;
      box-shadow: 0 4px 12px rgba(225, 29, 72, .25)
    }

    .btn-primary:hover {
      background: var(--red-500);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(225, 29, 72, .35)
    }

    .btn-ghost {
      background: transparent;
      color: var(--red-600);
      border: 1px solid var(--border)
    }

    .btn-ghost:hover {
      border-color: var(--red-600);
      color: var(--red-600);
      background: var(--bg-elevated)
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem;
      box-shadow: var(--shadow-sm)
    }

    .card-hover {
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1)
    }

    .card-hover:hover {
      border-color: var(--border-accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md)
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: .65rem;
      font-weight: 600;
      color: var(--red-600);
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: .5rem
    }

    .section-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2rem, 3vw, 2.5rem);
      color: var(--text-primary);
      letter-spacing: -.02em;
      line-height: 1.1
    }

    .data-table {
      width: 100%;
      border-collapse: collapse
    }

    .data-table th {
      padding: 1rem;
      text-align: left;
      font-family: var(--font-mono);
      font-size: .65rem;
      color: var(--text-secondary);
      letter-spacing: .05em;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap
    }

    .data-table td {
      padding: 1.2rem 1rem;
      border-bottom: 1px solid var(--bg-elevated);
      vertical-align: middle;
      font-size: .95rem;
      color: var(--text-primary)
    }

    .data-table tr:hover td {
      background: var(--bg-elevated)
    }

    .progress-track {
      height: 8px;
      background: var(--bg-elevated);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      animation: progressBar 1s cubic-bezier(0.16, 1, 0.3, 1)
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
      animation: slideIn .2s ease
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(225, 29, 72, .15)
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .8rem 1rem;
      border-radius: 10px;
      color: var(--text-secondary);
      transition: all .2s;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer
    }

    .nav-link:hover {
      color: var(--red-600);
      background: var(--bg-elevated)
    }

    .nav-link.active {
      color: var(--red-600);
      background: var(--bg-elevated);
      font-weight: 700;
      border-left: 3px solid var(--red-600);
    }

    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 1.4rem;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm)
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--red-400);
      background: var(--bg-elevated);
      transform: translateY(-2px)
    }

    .quiz-option.correct {
      border-color: var(--green-500);
      background: rgba(16, 185, 129, .05);
      color: var(--green-500)
    }

    .quiz-option.wrong {
      border-color: var(--red-500);
      background: rgba(225, 29, 72, .05);
      color: var(--red-500)
    }

    .quiz-option.selected {
      border-color: var(--red-600);
      background: rgba(225, 29, 72, .05)
    }

    .alert-bar {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 999;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--red-600);
      border-radius: 12px;
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      font-size: .95rem;
      font-weight: 600;
      animation: slideIn .3s ease;
      box-shadow: var(--shadow-md);
      max-width: 400px;
      color: var(--text-primary)
    }

    /* Chatbot Styles */
    .chatbot-toggle {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      background: var(--red-600);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(225, 29, 72, .3);
      cursor: pointer;
      z-index: 900;
      transition: all .3s;
    }

    .chatbot-toggle:hover {
      transform: scale(1.05) translateY(-2px);
    }

    .chatbot-window {
      position: fixed;
      bottom: 6rem;
      right: 2rem;
      width: 350px;
      height: 500px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(225, 29, 72, .15);
      display: flex;
      flex-direction: column;
      z-index: 900;
      overflow: hidden;
      animation: slideIn .3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chatbot-header {
      padding: 1.2rem;
      background: var(--red-600);
      color: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-family: var(--font-display);
    }

    .chatbot-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chatbot-msg {
      max-width: 85%;
      padding: .8rem 1.2rem;
      border-radius: 14px;
      font-size: .95rem;
      line-height: 1.5;
    }

    .chatbot-msg.user {
      align-self: flex-end;
      background: var(--red-600);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chatbot-msg.ai {
      align-self: flex-start;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .chatbot-input {
      padding: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: .5rem;
      background: var(--bg-surface);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

    // Setup Firebase Storage
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    function useGemini() {
      const generate = async (prompt, sysInstruct = "You are a helpful assistant.") => {
        const apiKey = "";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: sysInstruct }] }
        };
        const attempt = async (retries = 5, delay = 1000) => {
          try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error('API Error');
            const data = await res.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } catch (e) {
            if (retries > 0) {
              await new Promise(r => setTimeout(r, delay));
              return attempt(retries - 1, delay * 2);
            }
            throw e;
          }
        };
        return attempt();
      };
      return { generate };
    }

    const QUIZ_DATA = {
      fire: {
        title: 'Fire Safety', color: '#ef4444', emoji: '🔥',
        questions: [
          { id: 1, q: 'What does R.A.C.E stand for in fire emergencies?', options: ['Run, Alert, Call, Evacuate', 'Rescue, Alert, Contain, Extinguish/Evacuate', 'React, Alarm, Contain, Escape', 'Report, Assess, Call, Exit'], answer: 1 },
          { id: 2, q: 'When a fire alarm sounds, you should first:', options: ['Gather belongings then exit', 'Use elevator to evacuate faster', 'Feel door handle for heat before opening', 'Call friends to warn them'], answer: 2 },
          { id: 3, q: 'Which fire extinguisher type is safe for electrical fires?', options: ['Water', 'Foam', 'CO₂ or dry powder', 'Wet chemical'], answer: 2 }
        ]
      },
      flood: {
        title: 'Flood Protocol', color: '#dc2626', emoji: '🌊',
        questions: [
          { id: 1, q: 'During a flood warning, your first action should be:', options: ['Go to basement for shelter', 'Move to higher ground immediately', 'Attempt to drive through floodwater', 'Wade through water to reach others'], answer: 1 },
          { id: 2, q: 'How deep can moving floodwater be to sweep a person off their feet?', options: ['6 inches (15 cm)', '12 inches (30 cm)', '24 inches (60 cm)', '36 inches (90 cm)'], answer: 0 }
        ]
      },
      medical: {
        title: 'Medical Emergency', color: '#f87171', emoji: '⚕️',
        questions: [
          { id: 1, q: 'What is the first step when responding to an unconscious person?', options: ['Start CPR immediately', 'Check the scene for safety', 'Call their emergency contact', 'Offer them water'], answer: 1 },
          { id: 2, q: 'What is the universal ratio for CPR compressions to breaths?', options: ['15 compressions, 2 breaths', '30 compressions, 2 breaths', '50 compressions, 5 breaths', 'Continuous compressions only'], answer: 1 },
          { id: 3, q: 'If someone is choking and cannot cough or breathe, you should:', options: ['Perform the Heimlich maneuver (abdominal thrusts)', 'Slap their back gently', 'Wait to see if they clear it', 'Give them a drink of water'], answer: 0 }
        ]
      },
      threat: {
        title: 'Active Threat', color: '#991b1b', emoji: '🛡️',
        questions: [
          { id: 1, q: 'The national protocol for active threat situations is:', options: ['Hide, Fight, Flee', 'Run, Hide, Fight', 'Alert, Shelter, Evacuate', 'Freeze, Report, Comply'], answer: 1 },
          { id: 2, q: 'When hiding from a threat, you should:', options: ['Turn on lights to see clearly', 'Unlock doors for police access', 'Silence phones and block doors', 'Group in hallways for faster escape'], answer: 2 }
        ]
      },
    };

    const AuthCtx = createContext(null);

    function AuthProvider({ children }) {
      const [fbUser, setFbUser] = useState(null);
      const [user, setUser] = useState(null);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Auth Init Failed:", err);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (authUser) => {
          setFbUser(authUser);
          if (!authUser) { setUser(null); setReady(true); }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!fbUser) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', fbUser.uid);
        const unsub = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) setUser(docSnap.data());
          else setUser(null);
          setReady(true);
        }, (err) => { setReady(true); });
        return () => unsub();
      }, [fbUser]);

      const login = async (email, password, isSignup = false, name = '', role = 'student') => {
        let currentUser = auth.currentUser;
        if (!currentUser) {
          await signInAnonymously(auth);
          currentUser = auth.currentUser;
        }

        return new Promise(async (resolve, reject) => {
          let profileData = {};

          if (isSignup) {
            profileData = { id: currentUser.uid, name, rollNo: 'NEW' + Math.floor(Math.random() * 1000), dept: 'Computer Science', email, role: role, completedModules: [], status: 'Active', bloodGroup: '', medicalNotes: '' };
          } else {
            if (email === 'admin@campus.edu' && password === 'Password@123') {
              profileData = { id: currentUser.uid, name: 'Director Console', email, role: 'admin' };
            } else if (email === 'staff@campus.edu' && password === 'Password@123') {
              profileData = { id: currentUser.uid, name: 'Prof. Jane Doe', email, role: 'staff', dept: 'Faculty' };
            } else if (email === 'student@campus.edu' && password === 'Password@123') {
              profileData = { id: currentUser.uid, name: 'Alex Smith', rollNo: 'CS21000', dept: 'Computer Science', email, role: 'student', completedModules: ['fire', 'flood'], status: 'Active', bloodGroup: 'O+', medicalNotes: 'None' };
            } else {
              return reject(new Error('Invalid credentials. Check default accounts.'));
            }
          }

          try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid), profileData);
            setUser(profileData);
            resolve(profileData);
          } catch (e) {
            reject(new Error('Failed to create cloud profile.'));
          }
        });
      };

      const logout = async () => {
        await signOut(auth);
        setUser(null);
        window.location.hash = '#/login';
        window.location.reload();
      };

      const updateUser = async (patch) => {
        if (!fbUser) return;
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', fbUser.uid), patch);
      };

      return (
        <AuthCtx.Provider value={{ fbUser, user, login, logout, ready, updateUser }}>
          {children}
        </AuthCtx.Provider>
      );
    }
    const useAuth = () => useContext(AuthCtx);

    function navigate(hash) { window.location.hash = hash; }
    function useRoute() {
      const [hash, setHash] = useState(window.location.hash || '#/login');
      useEffect(() => {
        const h = () => setHash(window.location.hash || '#/login');
        window.addEventListener('hashchange', h);
        return () => window.removeEventListener('hashchange', h);
      }, []);
      return hash;
    }

    function Toast({ msg, type = 'info', onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
      const colors = { info: 'var(--red-600)', success: 'var(--green-500)', error: 'var(--red-500)', warn: 'var(--yellow-400)' };
      return (
        <div className="alert-bar" style={{ borderLeftColor: colors[type] }}>
          <span style={{ color: colors[type], fontSize: '1.2rem' }}>{type === 'error' ? '✖' : type === 'success' ? '✔' : type === 'warn' ? '⚠' : 'ℹ'}</span>
          <span style={{ flex: 1 }}>{msg}</span>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.2rem', lineHeight: 1 }}>×</button>
        </div>
      );
    }

    const Icon = ({ name, size = 18, color = 'currentColor', style = {} }) => {
      const paths = {

    const LogoHexagon = ({ size = 48 }) => (

    function Login({ onToast }) {
      const { login } = useAuth();
      const [view, setView] = useState('signin');
      const [form, setForm] = useState({ name: '', email: '', password: '' });
      const [show, setShow] = useState(false);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const [selectedRole, setSelectedRole] = useState('student');

      const submit = async (e) => {
        e.preventDefault();
        if (view === 'forgot') {
          if (!form.email) { setErr('Please enter your email address.'); return; }
          setBusy(true); setErr('');
          setTimeout(() => {
            onToast(`Password reset link sent to ${form.email}`, 'success');
            setView('signin');
            setBusy(false);
          }, 1000);
          return;
        }

        if (!form.email || !form.password || (view === 'signup' && !form.name)) { setErr('Please fill required fields.'); return; }
        setBusy(true); setErr('');
        try {
          const u = await login(form.email, form.password, view === 'signup', form.name, selectedRole);
          navigate(u.role === 'admin' ? '#/admin' : '#/portal');
        } catch (ex) {
          setErr(ex.message || 'Login failed.');
        } finally { setBusy(false); }
      };

      const getPlaceholderEmail = () => {
        if (selectedRole === 'admin') return 'admin@campus.edu';
        if (selectedRole === 'staff') return 'staff@campus.edu';
        return 'student@campus.edu';
      };
      const getPlaceholderPass = () => {
        return 'Password@123';
      };

      return (
        <div style={{ minHeight: '100vh', display: 'grid', gridTemplateColumns: '1fr 1fr', background: 'var(--bg-base)' }}>
          <div style={{ background: 'var(--bg-surface)', borderRight: '1px solid var(--border)', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '4rem', position: 'relative', overflow: 'hidden' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '3rem' }}>
              <LogoHexagon size={56} />
              <div>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: '2.4rem', letterSpacing: '-.02em', color: 'var(--red-600)', lineHeight: 1 }}>DPRES</div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.15em', fontWeight: 600 }}>DISASTER SYSTEM</div>
              </div>
            </div>
            <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(1.6rem, 2.5vw, 2.2rem)', color: 'var(--text-primary)', lineHeight: 1.1, letterSpacing: '-.02em', marginBottom: '1rem' }}>
              MINIMAL & CLOUD SYNCED<br /><span style={{ color: 'var(--red-600)' }}>SAFETY PROTOCOL</span>
            </h1>
            <p style={{ color: 'var(--text-secondary)', fontSize: '1rem', lineHeight: 1.6, maxWidth: 400 }}>
              Welcome to the live multi-user environment. Drills, grades, and registrations are securely synchronized in real-time across the campus network.
            </p>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem' }}>
            <div style={{ width: '100%', maxWidth: 420 }} className="fade-in">
              <div className="section-label" style={{ marginBottom: '.5rem' }}>▶ SECURE ACCESS</div>
              <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '2.6rem', color: 'var(--text-primary)', letterSpacing: '-.02em', marginBottom: '2rem' }}>
                {view === 'forgot' ? 'Reset Password' : view === 'signup' ? 'Create Account' : 'Sign In'}
              </h2>

              <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: '1.4rem' }}>
                {view === 'forgot' && (
                  <p style={{ color: 'var(--text-secondary)', fontSize: '.95rem', marginBottom: '.5rem', lineHeight: 1.5 }}>
                    Enter your registered email address and we'll send you a secure link to reset your password.
                  </p>
                )}

                {view === 'signin' && (
                  <div style={{ display: 'flex', background: 'var(--bg-elevated)', padding: '6px', borderRadius: '12px', border: '1px solid var(--border)' }}>
                    {['admin', 'student', 'staff'].map(role => (
                      <button
                        key={role}
                        type="button"
                        onClick={() => { setSelectedRole(role); setForm({ ...form, email: '', password: '' }); setErr(''); }}
                        style={{ flex: 1, padding: '.6rem', border: 'none', borderRadius: '8px', background: selectedRole === role ? 'var(--red-600)' : 'transparent', color: selectedRole === role ? '#fff' : 'var(--text-secondary)', fontWeight: 600, fontSize: '.9rem', textTransform: 'capitalize', transition: 'all 0.2s', cursor: 'pointer', boxShadow: selectedRole === role ? '0 2px 8px rgba(220,38,38,0.2)' : 'none' }}>
                        {role}
                      </button>
                    ))}
                  </div>
                )}

                {view === 'signup' && (
                  <div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 700 }}>FULL NAME</div>
                    <input type="text" placeholder="e.g. Priya Sharma" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
                  </div>
                )}

                <div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 700 }}>EMAIL ADDRESS</div>
                  <input type="email" placeholder={view === 'signin' ? getPlaceholderEmail() : 'name@campus.edu'} value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
                </div>

                {view !== 'forgot' && (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '.4rem' }}>
                      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', fontWeight: 700 }}>PASSWORD</div>
                      {view === 'signin' && (
                        <button type="button" onClick={() => setView('forgot')} style={{ background: 'none', border: 'none', fontSize: '.8rem', color: 'var(--red-600)', fontWeight: 600, cursor: 'pointer', padding: 0 }}>
                          Forgot?
                        </button>
                      )}
                    </div>
                    <div style={{ position: 'relative' }}>
                      <input type={show ? 'text' : 'password'} placeholder={view === 'signin' ? getPlaceholderPass() : '••••••••'} value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} style={{ paddingRight: '3rem' }} />
                      <button type="button" onClick={() => setShow(!show)} style={{ position: 'absolute', right: '.8rem', top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', color: 'var(--text-muted)' }}>
                        <Icon name={show ? 'eyeoff' : 'eye'} size={18} />
                      </button>
                    </div>
                  </div>
                )}

                {err && (
                  <div style={{ background: 'rgba(239,68,68,.05)', border: '1px solid rgba(239,68,68,.2)', borderRadius: 10, padding: '.8rem 1rem', fontSize: '.9rem', color: 'var(--red-600)', fontWeight: 600 }}>
                    ⚠ {err}
                  </div>
                )}

                <button type="submit" disabled={busy} className="btn btn-primary" style={{ padding: '1rem', fontSize: '1.05rem', marginTop: '.5rem' }}>
                  {busy ? '⟳ AUTHENTICATING...' : view === 'forgot' ? 'SEND RESET LINK →' : view === 'signup' ? 'SIGN UP →' : <>🔒 SIGN IN</>}
                </button>

                <div style={{ textAlign: 'center', marginTop: '1rem', fontSize: '.95rem', color: 'var(--text-secondary)' }}>
                  {view === 'forgot' ? (
                    <button type="button" onClick={() => setView('signin')} style={{ background: 'none', border: 'none', color: 'var(--red-600)', fontWeight: 700, cursor: 'pointer' }}>
                      ← Back to Sign In
                    </button>
                  ) : null}
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function Sidebar({ role }) {
      const { user, logout } = useAuth();
      const hash = useRoute();
      const [isOpen, setIsOpen] = useState(true);

      const links = role === 'admin'
        ? [{ hash: '#/admin', icon: 'dashboard', label: 'Dashboard' }, { hash: '#/admin/students', icon: 'users', label: 'Students DB' }, { hash: '#/admin/drills', icon: 'bell', label: 'Drill Manager' }, { hash: '#/portal/map', icon: 'map', label: 'Demo Campus Map' }]
        : [
          { hash: '#/portal', icon: 'dashboard', label: 'Overview' },
          { hash: '#/portal/simulator', icon: 'shield', label: 'AI Simulator ✨' },
          { hash: '#/portal/map', icon: 'map', label: 'Evacuation Map' },
          { hash: '#/portal/leaderboard', icon: 'star', label: 'Leaderboard' },
          { hash: '#/portal/contacts', icon: 'alert', label: 'Emergency Contacts' },
          { hash: '#/portal/settings', icon: 'edit', label: 'Profile Settings' }
        ];

      const getRoleBadge = () => {
        if (role === 'admin') return <span className="badge badge-red"><span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} /> ADMIN</span>;
        if (role === 'staff') return <span className="badge badge-purple"><span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} /> STAFF</span>;
        return <span className="badge badge-red"><span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} /> STUDENT</span>;
      };

      return (
        <aside style={{
          width: isOpen ? 260 : 80,
          background: 'var(--bg-surface)', borderRight: '1px solid var(--border)',
          display: 'flex', flexDirection: 'column', position: 'sticky', top: 0, height: '100vh', flexShrink: 0,
          transition: 'width 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
          overflowX: 'hidden'
        }}>
          <div style={{ padding: isOpen ? '1.5rem 1.2rem' : '1.5rem 0', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: isOpen ? 'flex-start' : 'center', gap: '.8rem', transition: 'padding 0.3s' }}>
            {isOpen && <LogoHexagon size={32} />}
            {isOpen && (
              <div style={{ flex: 1, whiteSpace: 'nowrap' }}>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: '1.4rem', color: 'var(--red-600)', letterSpacing: '-.02em', lineHeight: 1 }}>DPRES</div>
              </div>
            )}
            <button onClick={() => setIsOpen(!isOpen)} style={{ background: 'var(--bg-elevated)', border: 'none', borderRadius: '8px', color: 'var(--red-600)', cursor: 'pointer', padding: '0.5rem', display: 'flex', alignItems: 'center', justifyContent: 'center', marginLeft: isOpen ? 'auto' : 0 }} title={isOpen ? "Collapse" : "Expand"}>
              <Icon name="menu" size={18} />
            </button>
          </div>

          <div style={{ padding: isOpen ? '1.2rem' : '1.2rem 0', borderBottom: '1px solid var(--border)', display: 'flex', flexDirection: 'column', alignItems: isOpen ? 'flex-start' : 'center' }}>
            {isOpen ? (
              <div style={{ marginBottom: '.6rem' }}>{getRoleBadge()}</div>
            ) : (
              <div style={{ width: 14, height: 14, borderRadius: '50%', background: role === 'admin' ? 'var(--red-600)' : role === 'staff' ? 'var(--purple-500)' : 'var(--red-500)', marginBottom: '.6rem' }} />
            )}

            {isOpen && (
              <div style={{ whiteSpace: 'nowrap', width: '100%' }}>
                <div style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis' }}>{user?.name}</div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.7rem', color: 'var(--text-muted)' }}>{user?.email}</div>
              </div>
            )}
          </div>

          <nav style={{ flex: 1, padding: isOpen ? '1rem .8rem' : '1rem .4rem', display: 'flex', flexDirection: 'column', gap: '4px' }}>
            {links.map(l => {
              const active = hash === l.hash || (l.hash !== '#/admin' && l.hash !== '#/portal' && hash.startsWith(l.hash));
              return (
                <a key={l.hash} href={l.hash} className={`nav-link${active ? ' active' : ''}`} style={{ padding: isOpen ? '.7rem 1rem' : '.8rem', justifyContent: isOpen ? 'flex-start' : 'center' }} title={!isOpen ? l.label : undefined}>
                  <Icon name={l.icon} size={20} color={active ? 'var(--red-600)' : 'var(--text-secondary)'} />
                  {isOpen && <span style={{ flex: 1, whiteSpace: 'nowrap' }}>{l.label}</span>}
                  {isOpen && active && <Icon name="chevron" size={14} color="var(--red-600)" />}
                </a>
              );
            })}
          </nav>

          {isOpen ? (
            <div style={{ margin: '0 .8rem 1rem', padding: '1rem', background: 'var(--bg-elevated)', borderRadius: '12px', whiteSpace: 'nowrap' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '.4rem', marginBottom: '.3rem' }}>
                <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--red-500)', animation: 'pulse 2s infinite' }}></div>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: '.6rem', fontWeight: 700, color: 'var(--text-secondary)', letterSpacing: '.05em' }}>CLOUD SYNCED</span>
              </div>
              <div style={{ fontSize: '.85rem', fontWeight: 600, color: 'var(--red-600)' }}>Live Connected</div>
            </div>
          ) : (
            <div style={{ margin: '0 auto 1rem', padding: '.8rem', display: 'flex', justifyContent: 'center', cursor: 'help' }} title="Cloud Connected">
              <div style={{ width: 14, height: 14, borderRadius: '50%', background: 'rgba(220,38,38,.1)', border: '1px solid rgba(220,38,38,.3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--red-500)', animation: 'pulse 2s infinite' }}></div>
              </div>
            </div>
          )}

          <div style={{ padding: isOpen ? '.8rem' : '.8rem 0', borderTop: '1px solid var(--border)' }}>
            <button onClick={logout} className="nav-link" style={{ width: '100%', border: 'none', background: 'none', padding: isOpen ? '.7rem 1rem' : '.8rem', justifyContent: isOpen ? 'flex-start' : 'center' }} title={!isOpen ? "Sign Out" : undefined}>
              <Icon name="logout" size={20} />{isOpen && <span style={{ whiteSpace: 'nowrap' }}>Sign Out</span>}
            </button>
          </div>
        </aside>
      );
    }

    function BarChart({ data, height = 160 }) {

        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-around', height, paddingTop: 12 }}>

      const [users, setUsers] = useState([]);

      useEffect(() => {
        if (!fbUser) return;
        const uUnsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
          const arr = [];
          snap.forEach(d => { if (d.data().role === 'student') arr.push({ ...d.data(), id: d.id }); });
          setUsers(arr);
        }, err => console.error(err));

        const dUnsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'drills'), (snap) => {
          const arr = []; snap.forEach(d => arr.push({ ...d.data(), id: d.id }));
          arr.sort((a, b) => b.timestamp - a.timestamp);
          setDrills(arr);
        }, err => console.error(err));

        return () => { uUnsub(); dUnsub(); };
      }, [fbUser]);

      const modCounts = { fire: 0, flood: 0, quake: 0, threat: 0, medical: 0 };
      let trainedCount = 0;
      users.forEach(u => {
        const completed = u.completedModules || [];

        if (completed.length >= 4) trainedCount++;
      });

      const maxU = users.length || 1;
      const stats = { total: users.length, trained: trainedCount, pending: users.length - trainedCount, drillCount: drills.length };

        { label: 'Medical', value: Math.round((modCounts.medical / maxU) * 100), color: 'var(--red-500)' },
        { label: 'Threat', value: Math.round((modCounts.threat / maxU) * 100), color: 'var(--text-secondary)' },

        if (!drillMsg.trim() || !fbUser) return;

            title: drillMsg,
            type: drillType,
            timestamp: Date.now(),

              <input
                type="text"
                placeholder="Search student or roll no..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                onKeyDown={e => {
                  if (e.key === 'Enter') {
                    onToast(searchQuery.trim() ? `Searching registry for "${searchQuery}"...` : 'Opening Student Registry...', 'info');

                style={{ paddingLeft: '3rem', borderRadius: '30px', borderColor: 'var(--border)' }}

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '1.2rem' }}>

              { label: 'FULLY TRAINED', val: stats.trained, sub: 'Core modules completed', c: 'var(--red-500)' },
              { label: 'DRILLS DONE', val: stats.drillCount, sub: 'This academic year', c: 'var(--red-600)' },
              { label: 'PENDING', val: stats.pending, sub: 'Incomplete training', c: 'var(--orange-500)' },
            ].map(s => (
              <div key={s.label} className="card card-hover">
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 600 }}>{s.label}</div>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: '2.8rem', color: s.c, lineHeight: 1 }}>{s.val}</div>
                <div style={{ fontSize: '.85rem', color: 'var(--text-secondary)', marginTop: '.4rem' }}>{s.sub}</div>
              </div>
            ))}
          </div>

          <div className="card" style={{ borderLeft: '4px solid var(--red-600)' }}>
            <div className="section-label" style={{ marginBottom: '1rem' }}>▶ BROADCAST DRILL ALERT</div>
            <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap', alignItems: 'flex-end' }}>
              <div style={{ flex: 1, minWidth: 260 }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 600 }}>ALERT MESSAGE</div>

              </div>
              <div>

                  <option value="general">General</option>
                  <option value="fire">Fire</option>
                  <option value="flood">Flood</option>

                  <option value="threat">Active Threat</option>

              <button onClick={broadcast} disabled={broadcasting || !drillMsg.trim()} className="btn btn-primary" style={{ padding: '.8rem 1.6rem' }}>
                <Icon name="bell" size={18} color="#fff" /> {broadcasting ? 'SENDING...' : 'BROADCAST'}

            </div>
          </div>

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1.5rem', alignItems: 'stretch' }}>

            <div style={{ flex: '1 1 300px', minWidth: 0, display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
              <div className="card pop-in" style={{ animationDelay: '0.1s' }}>
                <div className="section-label" style={{ marginBottom: '.8rem' }}>▶ MODULE COMPLETION</div>
                <BarChart data={chartData} height={160} />
              </div>
              <div className="card pop-in" style={{ flex: 1, display: 'flex', flexDirection: 'column', animationDelay: '0.2s' }}>
                <div className="section-label" style={{ marginBottom: '1.2rem' }}>▶ RECENT DRILL ACTIVITY</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem', flex: 1 }}>
                  {drills.length === 0 ? <div style={{ color: 'var(--text-muted)', fontSize: '.9rem' }}>No drills recorded yet.</div> : null}
                  {drills.slice(0, 3).map((d) => (
                    <div key={d.id} style={{ display: 'flex', gap: '1rem', alignItems: 'flex-start', paddingBottom: '1rem', borderBottom: '1px solid var(--bg-hover)' }}>
                      <div style={{ width: 10, height: 10, borderRadius: '50%', background: d.status === 'Completed' ? 'var(--green-500)' : 'var(--orange-500)', marginTop: 4 }} />
                      <div>
                        <div style={{ fontSize: '.95rem', color: 'var(--text-primary)', fontWeight: 600, lineHeight: 1.3, marginBottom: '.2rem' }}>{d.title}</div>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.7rem', color: 'var(--text-muted)' }}>{new Date(d.timestamp).toLocaleString()}</div>
                      </div>

                  <div style={{ marginTop: 'auto', paddingTop: '1rem' }}>
                    <a href="#/admin/drills" style={{ fontSize: '.85rem', fontWeight: 700, color: 'var(--red-600)' }}>VIEW ALL LOGS ↗</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

    }

    function DrillManager({ onToast }) {
      const { fbUser } = useAuth();
      const [drills, setDrills] = useState([]);
      const [form, setForm] = useState({ title: '', type: 'Fire' });
      const [generating, setGenerating] = useState(false);
      const [generatingReportId, setGeneratingReportId] = useState(null);
      const [reports, setReports] = useState({});
      const { generate } = useGemini();

      useEffect(() => {
        if (!fbUser) return;
        const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'drills'), (snap) => {
          const arr = []; snap.forEach(d => arr.push({ ...d.data(), id: d.id }));
          arr.sort((a, b) => b.timestamp - a.timestamp);
          setDrills(arr);
        }, err => console.error(err));
        return () => unsub();
      }, [fbUser]);

      const scheduleDrill = async () => {
        if (!form.title) { onToast('Enter a title', 'warn'); return; }
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'drills'), {
            title: form.title, type: form.type, timestamp: Date.now(), status: 'Completed'
          });
          onToast('Drill added to cloud history!', 'success');
          setForm({ title: '', type: 'Fire' });
        } catch (e) {
          onToast('Failed to schedule', 'error');
        }
      };

      const deleteDrill = async (id) => {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'drills', id));
          onToast('Drill deleted', 'info');
        } catch (e) { }
      };

      const handleAiGenerate = async () => {
        setGenerating(true);
        try {
          const prompt = `Generate a realistic 1-sentence emergency drill alert title for a university campus for a ${form.type} emergency. Keep it under 60 characters. Do not use quotes or prefixes.`;
          const result = await generate(prompt, "You are a campus safety officer writing drill alerts.");
          setForm(prev => ({ ...prev, title: result.trim().replace(/^"|"$/g, '') }));
          onToast('Scenario generated!', 'success');
        } catch (e) {
          onToast('AI Generation failed.', 'error');
        } finally {
          setGenerating(false);
        }
      };

      const handleGenerateReport = async (drill) => {
        setGeneratingReportId(drill.id);
        try {
          const prompt = `Write a short, professional post-drill summary report (2-3 sentences) for a completed "${drill.type}" emergency drill titled "${drill.title}". Invent 1 realistic area for improvement.`;
          const result = await generate(prompt, "You are a campus safety administrative AI.");
          setReports(prev => ({ ...prev, [drill.id]: result }));
          onToast('Report generated!', 'success');
        } catch (e) {
          onToast('AI Generation failed.', 'error');
        } finally {
          setGeneratingReportId(null);
        }
      };

      return (
        <div className="fade-in">
          <div className="section-label">▶ CLOUD MANAGEMENT</div>
          <h1 className="section-title" style={{ marginBottom: '1.5rem' }}>DRILL MANAGER</h1>
          <div className="card" style={{ marginBottom: '2rem', borderLeft: '4px solid var(--red-600)' }}>
            <div className="section-label" style={{ marginBottom: '1rem' }}>RECORD NEW DRILL</div>
            <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap', alignItems: 'flex-end' }}>
              <div style={{ flex: 1, minWidth: 200 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 600 }}>DRILL TITLE</div>
                  <button onClick={handleAiGenerate} disabled={generating} style={{ background: 'none', border: 'none', fontSize: '.7rem', color: 'var(--red-600)', fontWeight: 700, cursor: 'pointer' }}>
                    {generating ? '✨ GENERATING...' : '✨ AUTO-GENERATE'}
                  </button>
                </div>
                <input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="e.g. Full Campus Evacuation" />
              </div>
              <div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 600 }}>TYPE</div>
                <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} style={{ minWidth: 150 }}>
                  <option>Fire</option><option>Flood</option><option>Medical</option><option>Threat</option>
                </select>
              </div>
              <button className="btn btn-primary" onClick={scheduleDrill} style={{ padding: '.8rem 1.4rem' }}>
                <Icon name="bell" size={16} color="#fff" /> SCHEDULE
              </button>
            </div>
          </div>

          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.8rem', fontWeight: 600 }}>CLOUD DRILL HISTORY</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            {drills.length === 0 ? <div style={{ color: 'var(--text-muted)' }}>No history yet.</div> : null}
            {drills.map(d => (
              <div key={d.id} className="card card-hover" style={{ display: 'flex', flexDirection: 'column', padding: '1.2rem', gap: '1rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: '1.1rem', marginBottom: '.2rem', color: 'var(--text-primary)' }}>{d.title}</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.8rem', color: 'var(--text-muted)' }}>{new Date(d.timestamp).toLocaleString()} • {d.type}</div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                    {d.status === 'Completed' && (
                      <button onClick={() => handleGenerateReport(d)} disabled={generatingReportId === d.id} style={{ background: 'none', border: 'none', fontSize: '.75rem', color: 'var(--red-600)', fontWeight: 700, cursor: 'pointer' }}>

                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--red-600)', fontWeight: 700, marginBottom: '.4rem', letterSpacing: '.05em' }}>✨ AI POST-DRILL SUMMARY</div>

      const [feedback, setFeedback] = useState('');
      const [status, setStatus] = useState('idle');

      const loadScenario = async () => {
        setStatus('loading_scenario');
        setFeedback('');
        setUserAction('');
        try {
          const res = await generate("Generate a brief, 2-sentence emergency scenario for a university student on campus (e.g., lab fire, active threat, medical issue). Address the student directly ('You are...'). Ask the student what their immediate next step is.", "You are a safety training simulator.");
          setScenario(res);
          setStatus('playing');

          setScenario("Failed to load scenario. Please check your connection and try again.");
          setStatus('idle');
        }
      };

      const evaluate = async () => {
        if (!userAction.trim()) return;
        setStatus('loading_feedback');

          const prompt = `Scenario: ${scenario}\nStudent's action: ${userAction}\nEvaluate the student's action. Is it safe? What is correct and what could be improved? Be concise (3-4 sentences). Give a final safety rating out of 10.`;

          setStatus('review');

          setFeedback("Error evaluating response. Please try again.");

    function Quiz() {
      const { fbUser, user, updateUser } = useAuth();
      const hash = window.location.hash;
      const topic = hash.split('/').pop();
      const data = QUIZ_DATA[topic] || QUIZ_DATA.fire;
      const [qIdx, setQIdx] = useState(0);
      const [selected, setSel] = useState(null);
      const q = data.questions[qIdx];

      const handleNext = async () => {
        if (qIdx < data.questions.length - 1) {
          setQIdx(qIdx + 1); setSel(null);
        } else {
          if (user && fbUser && !(user.completedModules || []).includes(topic)) {
            const newCompleted = [...(user.completedModules || []), topic];
            await updateUser({ completedModules: newCompleted });
          }
          window.location.hash = '#/portal';
        }
      };

      return (
        <div className="fade-in" style={{ maxWidth: 640, margin: '0 auto' }}>
          <div className="section-label">▶ QUIZ MODULE</div>
          <h1 className="section-title" style={{ color: data.color, marginBottom: '1.5rem' }}>{data.emoji} {data.title.toUpperCase()} TEST</h1>

          <div className="progress-track" style={{ height: 8, marginBottom: '1.5rem' }}>
            <div className="progress-fill" style={{ width: `${((qIdx + 1) / data.questions.length) * 100}%`, background: data.color }} />
          </div>

          <div className="card">
            <div style={{ fontFamily: 'var(--font-mono)', color: data.color, marginBottom: '.5rem', fontWeight: 700 }}>QUESTION {qIdx + 1} OF {data.questions.length}</div>
            <h3 style={{ marginBottom: '1.5rem', fontSize: '1.2rem', lineHeight: 1.4, color: 'var(--text-primary)' }}>{q.q}</h3>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '.8rem' }}>
              {q.options.map((opt, i) => (
                <button key={i} className={`quiz-option ${selected === i ? 'selected' : ''}`} onClick={() => setSel(i)}>

                </button>
              ))}

            <div style={{ marginTop: '2rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

              <button className="btn btn-primary" disabled={selected === null} style={{ background: data.color }} onClick={handleNext}>
                {qIdx < data.questions.length - 1 ? 'NEXT QUESTION →' : 'FINISH MODULE →'}
              </button>
            </div>
          </div>
        </div>
      );

      ];

        setActiveBuilding(b.id);
        setActiveFloor(0);
        setSelectedRoomIndex(null);
        setView('building');
      };

      const handleRoomSelect = (idx) => {
        setSelectedRoomIndex(idx);
        setRoomAiQuery('');
        setRoomAiResponse('');
      };

      const askRoomAI = async (roomName, riskProfile) => {
        if (!roomAiQuery.trim()) return;
        setRoomAiLoading(true);
        try {
          const prompt = `I am a student in the ${roomName}. The known hazards are: ${riskProfile.hazards.join(', ')}. I want to: "${roomAiQuery}". Is this safe? Give a concise 2-sentence evaluation.`;
          const res = await generate(prompt, "You are a strict, concise campus safety AI.");
          setRoomAiResponse(res);
        } catch (e) {
          setRoomAiResponse("Error assessing safety. Assume it is unsafe.");
        } finally {
          setRoomAiLoading(false);
        }
      };

      const getFloorDetails = (bId, floor) => {
        const items = [];
        items.push({ type: 'exit', x: 40, y: 250, label: floor === 0 ? 'EXIT' : 'STAIRS' });
        items.push({ type: 'exit', x: 760, y: 250, label: floor === 0 ? 'EXIT' : 'STAIRS' });
        items.push({ type: 'ext', x: 400, y: 180, label: 'FIRE EXT' });
        if (floor > 0) items.push({ type: 'ext', x: 200, y: 320, label: 'FIRE EXT' });
        items.push({ type: 'firstaid', x: 600, y: 180, label: 'FIRST AID' });

        if (bId === 'b') {
          if (floor === 1) items.push({ type: 'hazard', x: 180, y: 80, label: 'CHEMICAL LAB', desc: 'Flammable Storage' });
          if (floor === 2) items.push({ type: 'hazard', x: 550, y: 360, label: 'BIO LAB', desc: 'Biohazard Materials' });
        }
        if (bId === 'a' && floor === 3) {
          items.push({ type: 'hazard', x: 400, y: 80, label: 'SERVER ROOM', desc: 'High Voltage / Halon System' });
        }
        if (bId === 'k' && floor === 0) {
          items.push({ type: 'hazard', x: 250, y: 360, label: 'KITCHEN', desc: 'Gas Lines & Oils' });
        }
        if (bId === 'c' && floor === 0) {
          items.push({ type: 'hazard', x: 150, y: 80, label: 'MAIN ELEC PANEL', desc: 'High Voltage' });
        }

        return items;
      };

      const getRoomLabels = (bId, floor) => {
        const f = floor === 0 ? '1' : floor === 1 ? '2' : floor === 2 ? '3' : '4';
        if (bId === 'a') {
          const topMid = floor === 3 ? 'SERVER ROOM' : `LECTURE HALL ${f}A`;
          return [`CLASS ${f}01`, topMid, `CLASS ${f}02`, `CLASS ${f}03`, `STAFF ${f}01`, `CLASS ${f}04`];
        }
        if (bId === 'b') {
          const topLeft = floor === 1 ? 'CHEMICAL LAB' : `PHYSICS LAB ${f}`;
          const botRight = floor === 2 ? 'BIO LAB' : `COMPUTER LAB ${f}B`;
          return [topLeft, `MAIN LAB ${f}`, `PREP ROOM ${f}`, `WORKSHOP ${f}`, `STORAGE ${f}`, botRight];
        }
        if (bId === 'c') {
          const topLeft = floor === 0 ? 'ELEC ROOM' : `ADMIN ${f}01`;
          return floor === 0
            ? [topLeft, 'MAIN OFFICE', 'ACCOUNTS', 'ADMISSIONS', 'PANTRY', 'MEETING ROOM']
            : [topLeft, `CONFERENCE ${f}`, `ADMIN ${f}02`, 'HR DEPT', 'RECORDS', 'IT SUPPORT'];
        }
        if (bId === 'l') {
          return floor === 0
            ? ['CIRCULATION', 'MAIN READING', 'NEW ARRIVALS', 'PERIODICALS', 'OFFICE', 'REFERENCE']
            : [`QUIET ZONE ${f}`, `STACKS ${f}A`, `STACKS ${f}B`, 'DIGITAL LAB', 'STUDY ROOMS', 'ARCHIVES'];
        }
        if (bId === 'k') {
          const botLeft = floor === 0 ? 'KITCHEN' : 'PREP KITCHEN';
          return floor === 0
            ? ['WASHING', 'MAIN DINING', 'SNACK COUNTER', botLeft, 'STORE', 'STAFF DINING']
            : ['TERRACE DINING', 'EVENT HALL', 'BALCONY SEATING', botLeft, 'STORAGE', 'RESTROOMS'];
        }
        return ['ROOM 1', 'ROOM 2', 'ROOM 3', 'ROOM 4', 'ROOM 5', 'ROOM 6'];
      };

      const getRoomHazardDetails = (label) => {
        const lbl = label.toUpperCase();

          return {
            status: 'HIGH HAZARD', color: 'var(--red-500)', bg: 'rgba(239,68,68,0.08)',
            hazards: ['Toxic chemical agents & acids', 'Bunsen burners & live gas valves', 'Biological hazardous materials'],

          return {

            status: 'MEDIUM RISK', color: 'var(--orange-500)', bg: 'rgba(249,115,22,0.08)',

            eq: ['Follow corridor signs to main exit', 'Fire alarm pull station in hallway', 'Evacuation map posted near door']

    function Leaderboard() {
      const { fbUser } = useAuth();
      const [leaders, setLeaders] = useState([]);

      useEffect(() => {
        if (!fbUser) return;
        const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
          const arr = [];
          snap.forEach(d => {
            const data = d.data();
            if (data.role === 'student') arr.push({ ...data, pts: (data.completedModules?.length || 0) * 200 });
          });
          arr.sort((a, b) => b.pts - a.pts);
          setLeaders(arr);
        }, err => console.error(err));
        return () => unsub();
      }, [fbUser]);

      return (
        <div className="fade-in" style={{ maxWidth: 640, margin: '0 auto' }}>
          <div className="section-label">▶ LIVE RANKINGS</div>
          <h1 className="section-title" style={{ marginBottom: '1.5rem' }}>STUDENT LEADERBOARD</h1>
          <div className="card" style={{ padding: '2rem' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              {leaders.length === 0 ? <div style={{ textAlign: 'center', color: 'var(--text-muted)' }}>No students yet.</div> : null}
              {leaders.map((l, i) => (
                <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: '1.5rem', padding: '1rem', background: i < 3 ? 'var(--bg-elevated)' : 'var(--bg-surface)', borderRadius: 16, border: i === 0 ? '1px solid var(--yellow-400)' : i === 1 ? '1px solid var(--border)' : '1px solid transparent' }}>
                  <div style={{ fontSize: '2.2rem', fontWeight: 700, color: i === 0 ? 'var(--yellow-400)' : i === 1 ? '#a37575' : i === 2 ? '#b45309' : 'var(--text-muted)', width: 40, textAlign: 'center' }}>

                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: '1.1rem', color: 'var(--text-primary)' }}>{l.name}</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.75rem', color: 'var(--text-secondary)' }}>{l.rollNo || 'N/A'}</div>
                  </div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: '1.2rem', color: 'var(--red-600)' }}>{l.pts} <span style={{ fontSize: '.7rem', color: 'var(--text-muted)' }}>PTS</span></div>
                </div>
              ))}

          </div>

    function AIChatbot() {
      const [open, setOpen] = useState(false);
      const [input, setInput] = useState('');
      const [msgs, setMsgs] = useState([{ role: 'ai', text: 'Hi! I am the DPRES Safety Assistant. Ask me anything about campus safety protocols.' }]);
      const [loading, setLoading] = useState(false);
      const { generate } = useGemini();
      const msgsEndRef = useRef(null);

      useEffect(() => {
        msgsEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [msgs, open]);

      const send = async (e) => {
        e.preventDefault();
        if (!input.trim() || loading) return;
        const userTxt = input;
        setMsgs(p => [...p, { role: 'user', text: userTxt }]);
        setInput('');
        setLoading(true);
        try {
          const history = msgs.map(m => `${m.role === 'ai' ? 'Assistant' : 'User'}: ${m.text}`).join('\n');
          const prompt = `Chat History:\n${history}\nUser: ${userTxt}\nAnswer concisely as a campus safety AI assistant for a university. Keep responses short and helpful.`;
          const reply = await generate(prompt, "You are a concise, helpful campus safety AI assistant.");
          setMsgs(p => [...p, { role: 'ai', text: reply }]);
        } catch (e) {
          setMsgs(p => [...p, { role: 'ai', text: "Sorry, I am having trouble connecting to the network right now." }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <>
          <div className="chatbot-toggle" onClick={() => setOpen(!open)}>
            <Icon name={open ? 'x' : 'shield'} size={24} />
          </div>

          {open && (
            <div className="chatbot-window">
              <div className="chatbot-header">
                <div style={{ display: 'flex', alignItems: 'center', gap: '.5rem' }}>
                  <span style={{ fontSize: '1.2rem' }}>🤖</span> Safety Assistant
                </div>
              </div>
              <div className="chatbot-msgs">
                {msgs.map((m, i) => (
                  <div key={i} className={`chatbot-msg ${m.role}`}>
                    {m.text}
                  </div>
                ))}
                {loading && (
                  <div className="chatbot-msg ai" style={{ display: 'flex', gap: '4px', alignItems: 'center', width: 'fit-content' }}>
                    <div style={{ width: 6, height: 6, background: 'var(--text-muted)', borderRadius: '50%', animation: 'pulse 1s infinite' }} />
                    <div style={{ width: 6, height: 6, background: 'var(--text-muted)', borderRadius: '50%', animation: 'pulse 1s infinite .2s' }} />
                    <div style={{ width: 6, height: 6, background: 'var(--text-muted)', borderRadius: '50%', animation: 'pulse 1s infinite .4s' }} />
                  </div>
                )}
                <div ref={msgsEndRef} />
              </div>
              <form className="chatbot-input" onSubmit={send}>
                <input
                  type="text"
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  placeholder="Ask a safety question..."
                  style={{ padding: '.6rem 1rem', borderRadius: '20px' }}
                />
                <button type="submit" disabled={!input.trim() || loading} style={{ background: 'var(--red-600)', color: '#fff', border: 'none', width: '40px', height: '40px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <Icon name="send" size={16} />
                </button>
              </form>
            </div>
          )}
        </>
      );
    }

    function App() {
      const { user, ready, updateUser, fbUser } = useAuth();
      const hash = useRoute();
      const [toast, setToast] = useState(null);
      const onToast = (msg, type = 'info') => setToast({ msg, type });

      if (!ready) return <div style={{ padding: '3rem', textAlign: 'center', fontFamily: 'var(--font-mono)' }}>ESTABLISHING CLOUD CONNECTION...</div>;
      if (!user && hash !== '#/login') { setTimeout(() => navigate('#/login'), 0); return null; }
      if (user && hash === '#/login') { setTimeout(() => navigate(user.role === 'admin' ? '#/admin' : '#/portal'), 0); return null; }

      if (hash === '#/login' || !user) return <Login onToast={onToast} />;

      const content = () => {
        if (hash === '#/admin') return <AdminDashboard onToast={onToast} />;
        if (hash === '#/admin/students') return <StudentDatabase onToast={onToast} />;
        if (hash === '#/admin/drills') return <DrillManager onToast={onToast} />;
        if (hash === '#/portal') return <StudentPortal />;
        if (hash === '#/portal/simulator') return <AISimulator />;
        if (hash.startsWith('#/portal/quiz')) return <Quiz />;
        if (hash === '#/portal/map') return <EvacuationMap />;
        if (hash === '#/portal/leaderboard') return <Leaderboard />;

        if (hash === '#/portal/contacts') {
          const contacts = [
            { r: 'Campus Security', p: '9842410036', icon: 'shield', color: 'var(--red-500)', bg: 'rgba(239,68,68,0.1)' },
            { r: 'Medical Center', p: '9875463120', icon: 'alert', color: 'var(--green-500)', bg: 'rgba(16,185,129,0.1)' },
            { r: 'Local Police', p: '100', icon: 'shield', color: 'var(--orange-500)', bg: 'rgba(249,115,22,0.1)' },
            { r: 'Fire Department', p: '101', icon: 'fire', color: 'var(--red-600)', bg: 'rgba(220,38,38,0.1)' }
          ];

          return (
            <div className="fade-in" style={{ maxWidth: 700, margin: '0 auto' }}>
              <div className="section-label">▶ DIRECTORY</div>
              <h1 className="section-title" style={{ marginBottom: '1.5rem' }}>EMERGENCY CONTACTS</h1>

              <div className="card" style={{ padding: '1.5rem', borderTop: '4px solid var(--text-primary)' }}>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem', fontSize: '0.95rem', lineHeight: 1.6 }}>
                  In case of a life-threatening emergency, always contact the relevant authorities immediately. Tap the numbers below to initiate a call from a mobile device.
                </p>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  {contacts.map(c => (
                    <div key={c.r} style={{
                      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                      padding: '1rem 1.2rem',
                      background: 'var(--bg-elevated)',
                      borderRadius: '14px',
                      border: '1px solid var(--border)',
                      transition: 'all 0.2s ease',
                      cursor: 'pointer'
                    }}
                      onMouseEnter={(e) => { e.currentTarget.style.borderColor = c.color; e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = `0 6px 16px ${c.bg}`; }}
                      onMouseLeave={(e) => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.transform = 'none'; e.currentTarget.style.boxShadow = 'none'; }}
                      onClick={() => window.location.href = `tel:${c.p}`}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                        <div style={{ width: 48, height: 48, borderRadius: '12px', background: c.bg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                          <Icon name={c.icon} size={24} color={c.color} />
                        </div>
                        <div>
                          <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1rem', color: 'var(--text-primary)', letterSpacing: '0.02em', lineHeight: 1.2 }}>{c.r}</div>
                          <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', marginTop: '0.2rem' }}>Available 24/7</div>
                        </div>
                      </div>

                      <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                        <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 600, fontSize: '1.05rem', color: c.color, letterSpacing: '0.02em' }}>{c.p}</span>
                        <div style={{ background: c.bg, color: c.color, padding: '0.4rem 0.8rem', borderRadius: '8px', fontSize: '0.75rem', fontWeight: 800, letterSpacing: '0.05em' }}>
                          CALL
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        if (hash === '#/portal/settings') {
          const handleSave = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
              await updateUser({
                name: formData.get('name'),
                dept: formData.get('dept'),
                bloodGroup: formData.get('bloodGroup'),
                medicalNotes: formData.get('medicalNotes')
              });
              onToast('Profile settings saved successfully!', 'success');
            } catch (err) {
              onToast('Error saving profile.', 'error');
            }
          };

          return (
            <div className="fade-in" style={{ maxWidth: 640, margin: '0 auto' }}>
              <div className="section-label">▶ PREFERENCES</div>
              <h1 className="section-title" style={{ marginBottom: '1.5rem' }}>PROFILE SETTINGS</h1>

              <div className="card" style={{ marginBottom: '1.5rem' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem', marginBottom: '2rem', paddingBottom: '1.5rem', borderBottom: '1px solid var(--border)' }}>
                  <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'var(--bg-elevated)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icon name="users" size={32} color="var(--red-600)" />
                  </div>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: '1.4rem', color: 'var(--text-primary)' }}>{user?.name}</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.85rem', color: 'var(--text-muted)' }}>{user?.rollNo || 'N/A'} • {user?.email}</div>
                  </div>
                </div>

                <form onSubmit={handleSave} style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                  <div>
                    <div className="section-label" style={{ marginBottom: '1rem' }}>▶ PERSONAL INFORMATION</div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.2rem' }}>
                      <div>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 700 }}>FULL NAME</div>
                        <input type="text" name="name" defaultValue={user?.name} />
                      </div>
                      <div>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 700 }}>ROLL NUMBER</div>
                        <input type="text" defaultValue={user?.rollNo || ''} readOnly style={{ opacity: 0.6, cursor: 'not-allowed' }} />
                      </div>
                      <div style={{ gridColumn: '1 / -1' }}>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 700 }}>DEPARTMENT</div>
                        <select name="dept" defaultValue={user?.dept || "Computer Science"}>
                          <option>Computer Science</option>
                          <option>Electronics</option>
                          <option>Mechanical</option>
                          <option>Faculty</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div style={{ borderTop: '1px solid var(--border)', paddingTop: '1.5rem' }}>
                    <div className="section-label" style={{ marginBottom: '1rem' }}>▶ EMERGENCY MEDICAL INFO</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                      <div>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 700 }}>BLOOD GROUP</div>
                        <select name="bloodGroup" defaultValue={user?.bloodGroup || ""}>
                          <option value="">Select Blood Group...</option>
                          <option value="A+">A+</option><option value="A-">A-</option>
                          <option value="B+">B+</option><option value="B-">B-</option>
                          <option value="O+">O+</option><option value="O-">O-</option>
                          <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        </select>
                      </div>
                      <div>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '.65rem', color: 'var(--text-secondary)', letterSpacing: '.1em', marginBottom: '.4rem', fontWeight: 700 }}>MEDICAL NOTES (ALLERGIES, CONDITIONS)</div>
                        <textarea name="medicalNotes" rows={3} defaultValue={user?.medicalNotes || ""} placeholder="e.g. Peanut allergy, Asthma..." style={{ resize: 'vertical' }}></textarea>
                      </div>
                    </div>
                  </div>

                  <div style={{ borderTop: '1px solid var(--border)', paddingTop: '1.5rem' }}>
                    <div className="section-label" style={{ marginBottom: '1rem' }}>▶ NOTIFICATION PREFERENCES</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '.8rem' }}>
                      <label style={{ display: 'flex', alignItems: 'center', gap: '1rem', cursor: 'pointer' }}>
                        <input type="checkbox" defaultChecked style={{ width: 'auto' }} />
                        <span style={{ fontSize: '.95rem', color: 'var(--text-primary)', fontWeight: 500 }}>SMS Alerts for Active Drills</span>
                      </label>
                      <label style={{ display: 'flex', alignItems: 'center', gap: '1rem', cursor: 'pointer' }}>
                        <input type="checkbox" defaultChecked style={{ width: 'auto' }} />
                        <span style={{ fontSize: '.95rem', color: 'var(--text-primary)', fontWeight: 500 }}>Email Weekly Digest</span>
                      </label>
                    </div>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '1rem' }}>
                    <button type="submit" className="btn btn-primary">
                      SAVE CHANGES
                    </button>
                  </div>
                </form>
              </div>
            </div>
          );
        }

        return <div style={{ padding: '2rem' }}>NOT FOUND</div>;
      };

      return (
        <div style={{ display: 'flex', minHeight: '100vh', background: 'var(--bg-deep)' }}>
          <Sidebar role={user.role} />
          <main style={{ flex: 1, padding: '2.5rem', overflowY: 'auto', minWidth: 0, position: 'relative' }}>
            {content()}
          </main>
          <AIChatbot />
          {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuthProvider><App /></AuthProvider>);
  </script>
</body>

</html>
